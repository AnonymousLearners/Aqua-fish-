<style>

<script>

const SUPABASE_URL = "https://zmtcyldbyyjxwhzbizkt.supabase.co";      // e.g. https://abcd1234.supabase.co
const SUPABASE_ANON_KEYconst NOTICE = `\u003Cdiv class=\"notice\">\u003Cb>STORE PICKUP ONLY\u003C/b>\u003Cbr>No online payment • No Cash on Delivery • No home delivery\u003Cbr>\u003Csmall>Online payment and home delivery are not available. Orders are confirmed by the store and customers must collect and pay at the physical store.\u003C/small>\u003C/div>`; = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InptdGN5bGRieXlqeHdoemJpemt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzNjI1MTMsImV4cCI6MjEwNjkzODUxM30.xe8wnPA_-fyF80TlWr2ZTYbwCAVn-2G9KgcpqOq7XKI"; // the "anon public" key (NEVER the service_role key)
/* ================================================================================== */
const sb = SUPABASE_URL ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
const S = {cats:[],prods:[],svcs:[],set:{},cart:JSON.parse(localStorage.getItem('cart')||'{}'),q:'',cat:'',sort:'',user:null,tab:'products'};
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr = n => '₹' + Number(n).toLocaleString('en-IN');
const toast = m => {const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)};
const digits = p => '91' + String(p||'').replace(/\D/g,'').slice(-10);
const catOf = id => S.cats.find(c=>c.id===id)||{name:'Other',emoji:'🐟'};
const NOTICE = `<div class="notice"><b>STORE PICKUP ONLY</b><br>No online payment • No Cash on Delivery • No home delivery<br><small>Online payment and home delivery are not available. Orders are confirmed by the store and customers must collect and pay at the physical store.</small></div>`;
const save = () => {localStorage.setItem('cart',JSON.stringify(S.cart));const n=Object.values(S.cart).reduce((a,b)=>a+b,0);$('#cc').textContent=n;$('#cc').style.display=n?'block':'none'};

async function load(){
  if(!sb){app.innerHTML=`<section><h1>Almost there</h1><p style="margin-top:12px">Open <b>index.html</b> in a text editor and paste your Supabase URL and anon key near the top of the script. See README.md.</p></section>`;return false}
  const [c,p,s,t] = await Promise.all([sb.from('categories').select('*').order('created_at'),sb.from('products').select('*').order('created_at'),sb.from('services').select('*').order('created_at'),sb.from('store_settings').select('*').eq('id',1).maybeSingle()]);
  S.cats=c.data||[];S.prods=p.data||[];S.svcs=s.data||[];S.set=t.data||{};
  const u=(await sb.auth.getSession()).data.session;S.user=u?.user||null;return true;
}
const fresh = async()=>{await load();route()};

function pcard(p){const c=catOf(p.category_id);
  return `<article class="card">${p.image_url?`<img class="im" loading="lazy" src="${esc(p.image_url)}" alt="${esc(p.name)}">`:`<div class="im" role="img" aria-label="${esc(p.name)}">${c.emoji||'🐟'}</div>`}
  <div class="b"><span class="cat">${esc(c.name)}</span><h3>${esc(p.name)}</h3><p>${esc(p.description)}</p><div class="price">${inr(p.price)}</div>
  <span class="tag ${p.in_stock?'in':'out'}">${p.in_stock?'In Stock':'Out of Stock'}</span>
  <button class="btn p" data-add="${p.id}" ${p.in_stock?'':'disabled'}>${p.in_stock?'Add to Cart':'Out of Stock'}</button></div></article>`}

const views = {
home(){const f=S.prods.filter(p=>p.featured);const st=S.set;
 return `<section class="hero"><div class="bubbles">${Array.from({length:9},(_,i)=>`<i style="left:${i*11+3}%;width:${10+i*4}px;height:${10+i*4}px;animation-duration:${9+i*2}s;animation-delay:-${i*2}s"></i>`).join('')}</div><div class="fish" aria-hidden="true">🐠</div>
 <div style="position:relative"><h1>Bring Your Aquarium to Life</h1><p class="l">Fish, aquariums, pet supplies, birds, cages and aquarium services — all from your local store in Raebareli.</p>
 <p><b>${esc(st.store_name)}</b><br>Ratapur Chauraha, near Polytechnic, Raebareli<br>Open Daily: ${esc(st.opening_time)} – ${esc(st.closing_time)}</p><br>
 <div class="row"><a class="btn p" href="#/shop">Browse Products</a><a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${digits(st.phone1)}">WhatsApp Us</a><a class="btn" target="_blank" rel="noopener" href="${esc(st.maps_url)}">Visit Store</a></div></div></section>
 <div class="steps"><div>1. Order online</div><div>2. Confirm availability</div><div>3. Visit store</div><div>4. Pay &amp; collect</div></div>${NOTICE}
 <section><h2>Featured Products</h2><div class="grid">${f.map(pcard).join('')||'<p>No featured products yet.</p>'}</div></section>
 <section><h2>Shop by category</h2><div class="row">${S.cats.map(c=>`<a class="btn" href="#/shop?cat=${c.id}">${c.emoji||''} ${esc(c.name)}</a>`).join('')}</div></section>`},
shop(){let l=S.prods.filter(p=>(!S.cat||p.category_id===S.cat)&&(p.name+' '+(p.description||'')+' '+catOf(p.category_id).name).toLowerCase().includes(S.q.toLowerCase()));
 if(S.sort)l=[...l].sort((a,b)=>S.sort==='lo'?a.price-b.price:b.price-a.price);
 return `<section><h1 style="font-size:2rem;margin-bottom:14px">Shop</h1><div class="tools"><input id="q" type="search" placeholder="Search goldfish, food, filter, cage…" value="${esc(S.q)}" aria-label="Search products"><select id="sort" aria-label="Sort"><option value="">Sort by</option><option value="lo" ${S.sort==='lo'?'selected':''}>Price: Low → High</option><option value="hi" ${S.sort==='hi'?'selected':''}>Price: High → Low</option></select></div>
 <div class="chips"><button data-cat="" class="${S.cat?'':'on'}">All</button>${S.cats.map(c=>`<button data-cat="${c.id}" class="${S.cat===c.id?'on':''}">${c.emoji||''} ${esc(c.name)}</button>`).join('')}</div>
 <div class="grid" id="plist">${l.map(pcard).join('')||'<p>No products found.</p>'}</div></section>`},
services(){return `<section><h1 style="font-size:2rem;margin-bottom:6px">Aquarium Services</h1><p style="color:var(--mut);margin-bottom:18px">Tell us what you need and we will reply on WhatsApp with details and availability.</p><div class="grid">${S.svcs.filter(s=>s.active).map(s=>`<article class="card"><div class="b"><h3>🛠️ ${esc(s.name)}</h3><p>${esc(s.description)}</p><button class="btn wa" data-svc="${s.id}">Request Service on WhatsApp</button></div></article>`).join('')}</div></section>`},
about(){return `<section><h1 style="font-size:2rem;margin-bottom:14px">About ${esc(S.set.store_name)}</h1><p style="max-width:65ch">${esc(S.set.about)}</p></section>`},
contact(){const s=S.set;return `<section><h1 style="font-size:2rem;margin-bottom:14px">Contact</h1><div class="pad"><h2>${esc(s.store_name)}</h2><p>${esc(s.address)}</p><p>Open daily ${esc(s.opening_time)} – ${esc(s.closing_time)}</p><p>📞 ${esc(s.phone1)} · ${esc(s.phone2)}<br>✉️ ${esc(s.email)}</p><br><div class="row"><a class="btn p" href="tel:+${digits(s.phone1)}">Call</a><a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${digits(s.phone1)}">WhatsApp</a><a class="btn" href="mailto:${esc(s.email)}">Email</a><a class="btn" target="_blank" rel="noopener" href="${esc(s.maps_url)}">Google Maps</a></div></div></section>`},
cart(){const it=Object.entries(S.cart).map(([id,q])=>({p:S.prods.find(x=>x.id===id),q})).filter(x=>x.p);const tot=it.reduce((a,x)=>a+x.p.price*x.q,0);
 return `<section><h1 style="font-size:2rem">Your Cart</h1>${NOTICE}${it.length?it.map(({p,q})=>`<div class="line"><div><b>${esc(p.name)}</b><br><span style="color:var(--mut)">${inr(p.price)} each</span></div><div class="qty"><button data-dec="${p.id}" aria-label="Decrease">−</button><b>${q}</b><button data-add="${p.id}" aria-label="Increase">+</button></div><b>${inr(p.price*q)}</b><button class="btn sm" data-rm="${p.id}">Remove</button></div>`).join('')+`<div class="line"><h2 style="margin:0">Total</h2><h2 style="margin:0">${inr(tot)}</h2></div><br><div class="row"><button class="btn wa" data-order="1">Order via WhatsApp 1</button><button class="btn wa" data-order="2">Order via WhatsApp 2</button><button class="btn p" data-order="mail">Order via Email</button><button class="btn" data-empty="1">Empty cart</button></div>`:'<p style="margin:20px 0">Your cart is empty. <a href="#/shop" style="color:var(--aq)">Browse products</a></p>'}</section>`}
};
function orderText(){const it=Object.entries(S.cart).map(([id,q])=>({p:S.prods.find(x=>x.id===id),q})).filter(x=>x.p);const tot=it.reduce((a,x)=>a+x.p.price*x.q,0);
 return `Hello ${S.set.store_name},\n\nI want to place a store-pickup order:\n\n${it.map(x=>`${x.q} × ${x.p.name} — ${inr(x.p.price*x.q)}`).join('\n')}\n\nTotal: ${inr(tot)}\n\nI understand that this is not an online payment or delivery order. I will collect and pay at the ${S.set.store_name} store after availability is confirmed.\n\nThank you.`}

/* ---------- Admin ---------- */
const sel = (id,val,opts) => `<select id="${id}">${opts.map(o=>`<option value="${o[0]}" ${o[0]===val?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
async function admin(){
 if(!S.user)return app.innerHTML=`<section style="max-width:420px;margin:auto"><h1>Admin Login</h1><div class="f"><label for="em">Email</label><input id="em" type="email" autocomplete="username"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"><br><br><button class="btn p" id="login" style="width:100%">Log in</button></div></section>`;
 const tabs=['products','categories','services','requests','orders','settings'];let body='';const t=S.tab;
 if(t==='products')body=`<button class="btn p" data-edit="products:new">+ Add product</button><div class="tw"><table><tr><th>Name</th><th>Price</th><th>Stock</th><th>★</th><th></th></tr>${S.prods.map(p=>`<tr><td>${esc(p.name)}<br><small>${esc(catOf(p.category_id).name)}</small></td><td>${inr(p.price)}</td><td><button class="btn sm" data-tog="${p.id}:in_stock">${p.in_stock?'In Stock':'Out of Stock'}</button></td><td><button class="btn sm" data-tog="${p.id}:featured">${p.featured?'★':'☆'}</button></td><td><button class="btn sm" data-edit="products:${p.id}">Edit</button> <button class="btn sm" data-del="products:${p.id}">Delete</button></td></tr>`).join('')}</table></div>`;
 if(t==='categories')body=`<button class="btn p" data-edit="categories:new">+ Add category</button><div class="tw"><table>${S.cats.map(c=>`<tr><td>${c.emoji||''} ${esc(c.name)}</td><td><button class="btn sm" data-edit="categories:${c.id}">Edit</button> <button class="btn sm" data-del="categories:${c.id}">Delete</button></td></tr>`).join('')}</table></div>`;
 if(t==='services')body=`<button class="btn p" data-edit="services:new">+ Add service</button><div class="tw"><table>${S.svcs.map(c=>`<tr><td>${esc(c.name)}<br><small>${c.active?'Available':'Hidden'}</small></td><td><button class="btn sm" data-edit="services:${c.id}">Edit</button> <button class="btn sm" data-del="services:${c.id}">Delete</button></td></tr>`).join('')}</table></div>`;
 if(t==='requests'||t==='orders'){const tb=t==='orders'?'orders':'service_requests';const r=(await sb.from(tb).select('*').order('created_at',{ascending:false})).data||[];const st=t==='orders'?['New','Confirmed','Ready for Pickup','Completed','Cancelled']:['New','Contacted','Scheduled','Completed','Cancelled'];
  body=`<div class="tw"><table>${r.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}<br>${esc(x.customer_name)} ${esc(x.customer_phone)}<br><small>${esc(x.service_name||JSON.stringify(x.items||''))} ${esc(x.message||'')}</small></td><td><select data-st="${tb}:${x.id}">${st.map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td>Nothing yet.</td></tr>'}</table></div>`}
 if(t==='settings'){const s=S.set;const F=[['store_name','Store name'],['phone1','Phone / WhatsApp 1'],['phone2','Phone / WhatsApp 2'],['email','Email'],['address','Address'],['opening_time','Opening time'],['closing_time','Closing time'],['maps_url','Google Maps link']];
  body=`<div class="f">${F.map(([k,l])=>`<label for="s_${k}">${l}</label><input id="s_${k}" value="${esc(s[k])}">`).join('')}<label for="s_about">About text</label><textarea id="s_about" rows="5">${esc(s.about)}</textarea><br><button class="btn p" id="saveset">Save settings</button></div>`}
 const n=S.prods.length,ins=S.prods.filter(p=>p.in_stock).length;
 app.innerHTML=`<section><div class="row" style="justify-content:space-between"><h1>Admin Dashboard</h1><button class="btn" id="logout">Log out</button></div>
 <div class="two" style="margin-top:12px"><div class="pad"><div class="stat">${n}</div>Total products</div><div class="pad"><div class="stat">${ins}</div>In stock</div><div class="pad"><div class="stat">${n-ins}</div>Out of stock</div><div class="pad"><div class="stat">${S.cats.length}</div>Categories</div></div>
 <div class="chips tabs">${tabs.map(x=>`<button data-tab="${x}" class="${x===t?'on':''}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div>${body}</section>`}
function editor(tb,id){const dlg=$('#dlg');const isN=id==='new';const rec=isN?{}:(tb==='products'?S.prods:tb==='categories'?S.cats:S.svcs).find(x=>x.id===id);
 let f=`<label>Name</label><input id="e_name" value="${esc(rec.name)}">`;
 if(tb==='products')f+=`<label>Category</label>${sel('e_cat',rec.category_id,S.cats.map(c=>[c.id,c.name]))}<label>Price (₹)</label><input id="e_price" type="number" min="0" value="${rec.price??''}"><label>Description</label><textarea id="e_desc">${esc(rec.description)}</textarea><label>Photo</label><input id="e_img" type="file" accept="image/*"><label>SKU (optional)</label><input id="e_sku" value="${esc(rec.sku)}"><label><input type="checkbox" id="e_stock" style="width:auto;min-height:0" ${rec.in_stock!==false?'checked':''}> In stock</label><label><input type="checkbox" id="e_feat" style="width:auto;min-height:0" ${rec.featured?'checked':''}> Featured on homepage</label>`;
 if(tb==='categories')f+=`<label>Emoji icon</label><input id="e_emoji" value="${esc(rec.emoji||'🐟')}">`;
 if(tb==='services')f+=`<label>Description</label><textarea id="e_desc">${esc(rec.description)}</textarea><label><input type="checkbox" id="e_act" style="width:auto;min-height:0" ${rec.active!==false?'checked':''}> Available</label>`;
 dlg.innerHTML=`<h2>${isN?'Add':'Edit'} ${tb.slice(0,-1)}</h2>${f}<br><div class="row"><button class="btn p" id="e_save">Save</button><button class="btn" id="e_cancel">Cancel</button></div>`;dlg.showModal();
 $('#e_cancel').onclick=()=>dlg.close();
 $('#e_save').onclick=async()=>{const v=id=>$('#'+id);let row={name:v('e_name').value.trim()};if(!row.name)return toast('Name is required');
  if(tb==='products'){row={...row,category_id:v('e_cat').value||null,price:+v('e_price').value||0,description:v('e_desc').value,sku:v('e_sku').value,in_stock:v('e_stock').checked,featured:v('e_feat').checked,updated_at:new Date().toISOString()};
   const file=v('e_img').files[0];if(file){const path=Date.now()+'-'+file.name.replace(/[^\w.]/g,'_');const up=await sb.storage.from('product-images').upload(path,file);if(up.error)return toast(up.error.message);row.image_url=sb.storage.from('product-images').getPublicUrl(path).data.publicUrl}}
  if(tb==='categories')row.emoji=v('e_emoji').value;
  if(tb==='services'){row.description=v('e_desc').value;row.active=v('e_act').checked}
  const r=isN?await sb.from(tb).insert(row):await sb.from(tb).update(row).eq('id',id);
  if(r.error)return toast(r.error.message);dlg.close();toast('Saved');fresh()}}

/* ---------- Routing & events ---------- */
function route(){const [path,qs]=(location.hash.slice(2)||'').split('?');const pg=path||'home';
 if(qs){const c=new URLSearchParams(qs).get('cat');if(c!==null)S.cat=c}
 document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#/'+(path||'')));
 $('#nav').classList.remove('open');save();
 if(pg==='admin')admin();else app.innerHTML=(views[pg]||views.home)();
 const s=S.set;$('#foot').innerHTML=`<div><b style="color:var(--tx)">${esc(s.store_name)}</b><br>Ratapur Chauraha, near Polytechnic, Raebareli<br>${esc(s.opening_time)} – ${esc(s.closing_time)}<br>${esc(s.phone1)} · ${esc(s.phone2)}<br>${esc(s.email)}</div><div><a href="#/shop">Shop</a><a href="#/services">Services</a><a href="#/about">About</a><a href="#/contact">Contact</a><a href="#/cart">Cart</a><a href="#/admin">Admin Login</a></div>`;
 window.scrollTo(0,0)}
$('#burger').onclick=e=>{const o=$('#nav').classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',o)};
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;$('#plist').innerHTML=views.shop().match(/<div class="grid" id="plist">([\s\S]*)<\/div><\/section>$/)[1]}});
document.addEventListener('change',async e=>{const t=e.target;if(t.id==='sort'){S.sort=t.value;route()}
 if(t.dataset.st){const [tb,id]=t.dataset.st.split(':');await sb.from(tb).update({status:t.value}).eq('id',id);toast('Status updated')}});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.add){const p=S.prods.find(x=>x.id===d.add);if(!p?.in_stock)return;S.cart[d.add]=(S.cart[d.add]||0)+1;save();if(location.hash==='#/cart')route();else toast('Added to cart')}
 if(d.dec){S.cart[d.dec]--;if(S.cart[d.dec]<1)delete S.cart[d.dec];route()}
 if(d.rm){delete S.cart[d.rm];route()}
 if(d.empty){S.cart={};route()}
 if('cat' in d){S.cat=d.cat;route()}
 if(d.order){const txt=orderText();if(d.order==='mail')location.href=`mailto:${S.set.email}?subject=${encodeURIComponent('Aqua Fish Aquarium Store Pickup Order')}&body=${encodeURIComponent(txt)}`;else window.open(`https://wa.me/${digits(d.order==='1'?S.set.phone1:S.set.phone2)}?text=${encodeURIComponent(txt)}`,'_blank')}
 if(d.svc){const s=S.svcs.find(x=>x.id===d.svc);const dlg=$('#dlg');dlg.innerHTML=`<h2>${esc(s.name)}</h2><p style="color:var(--mut);font-size:.9rem">Optional: add your name and phone so the store can follow up. If you enter them, they are saved in the store's private service-request list. Leave blank to just open WhatsApp.</p><label>Your name</label><input id="r_n"><label>Phone</label><input id="r_p" type="tel"><br><br><div class="row"><button class="btn wa" id="r_go">Open WhatsApp</button><button class="btn" id="r_x">Cancel</button></div>`;dlg.showModal();
  $('#r_x').onclick=()=>dlg.close();$('#r_go').onclick=async()=>{const n=$('#r_n').value.trim(),p=$('#r_p').value.trim();if(n||p)await sb.from('service_requests').insert({customer_name:n,customer_phone:p,service_id:s.id,service_name:s.name});dlg.close();window.open(`https://wa.me/${digits(S.set.phone1)}?text=${encodeURIComponent(`Hello ${S.set.store_name}, I would like to request ${s.name} service. Please provide details and availability.`)}`,'_blank')}}
 if(d.tab){S.tab=d.tab;route()}
 if(d.edit){const [tb,id]=d.edit.split(':');editor(tb,id)}
 if(d.tog){const [id,k]=d.tog.split(':');const p=S.prods.find(x=>x.id===id);await sb.from('products').update({[k]:!p[k],updated_at:new Date().toISOString()}).eq('id',id);fresh()}
 if(d.del){if(!confirm('Are you sure you want to delete this '+d.del.split(':')[0].replace(/s$/,'')+'?'))return;const [tb,id]=d.del.split(':');const r=await sb.from(tb).delete().eq('id',id);r.error?toast(r.error.message):(toast('Deleted'),fresh())}
 if(b.id==='login'){const r=await sb.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});r.error?toast(r.error.message):fresh()}
 if(b.id==='logout'){await sb.auth.signOut();S.user=null;route()}
 if(b.id==='saveset'){const row={id:1};['store_name','phone1','phone2','email','address','opening_time','closing_time','maps_url','about'].forEach(k=>row[k]=$('#s_'+k).value);const r=await sb.from('store_settings').upsert(row);r.error?toast(r.error.message):(toast('Settings saved'),fresh())}
});
window.addEventListener('hashchange',route);
load().then(ok=>ok&&route());
</script></body></html>
